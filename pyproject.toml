[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name='svafotate_cpg'
description='SVAFotate (CPG fork): annotate structural variant VCFs with population allele frequencies, on modern pandas/numpy'
readme = "README.md"
version="0.2.0"
requires-python = ">=3.10"
license-files = ["LICENSE"]
classifiers=[
    'Environment :: Console',
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: Unix',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
]

dependencies=[
    'cyvcf2>=0.31',
    'numpy>=1.26',
]

[project.urls]
Repository = "https://github.com/MattWellie/svafotate"

[project.scripts]
svafotate = 'svafotate_cpg.cli:main'

[dependency-groups]
dev = [
    'pytest>=8',
    'pytest-cov',
    'ruff',
    'mypy',
]

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['tests']
addopts = '-ra'

[tool.hatch.build.targets.wheel]
packages = ["src/svafotate_cpg"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
extend-exclude = ["venv", ".mypy_cache", ".venv", "build", "dist"]

[tool.ruff.lint]
# ignore pydocstyle, flake8-boolean-trap (FBT)
select = ["A", "B", "C", "E", "F", "G", "I", "N", "Q", "S", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "UP", "YTT"]

fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "FBT", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "UP", "YTT"]

ignore = [
    "ANN001", # Missing type annotation for function argument
    "ANN201", # Missing return type annotation for public function
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "ANN204", # Missing type annotation for special method `__init__`
    "COM812", # trailing comma missing, redundant when combined with the formatter
    "G004", # Logging statement uses f-string
    "PLW0603", # Using the global statement to update `<VAR>` is discouraged
    "S101", # Use of assert detected
    "PLR0912", # Too many branches (> 12)
    "PLR0913", # Too many arguments in function (> 5)
    "C901", # method is too complex (> 10 conditions)
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
    "PLR2004", # Magic value used in comparison, consider replacing `X` with a constant variable. I don't rate this
    "PLW0108", # Lambda may be unnecessary; consider inlining inner function
    "PLR0915", # Too many statements (> 50)
    "TC001", # runtime imports of typing-only names are fine in a CLI (no import-time cost worth a TYPE_CHECKING block)
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
# argparse help strings and VCF header descriptions are long single strings by nature
"src/svafotate_cpg/cli.py" = ["E501"]
"src/svafotate_cpg/annotations.py" = ["E501"]
"tests/*" = ["E501"]
"scripts/*" = ["E501", "S603"]  # subprocess calls run the oracle / benchmark executables by design

[tool.ruff.format]
indent-style = 'space'
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.bumpversion]
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version="{current_version}"'
replace = 'version="{new_version}"'

[[tool.bumpversion.files]]
filename = "src/svafotate_cpg/__init__.py"
search = "{current_version}"
replace = "{new_version}"
